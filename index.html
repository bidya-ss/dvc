<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bidyadhar Sahoo | Digital Visiting Card</title>

<!-- Open Graph tags - WhatsApp/Facebook/Telegram preview ke liye (static, kyunki crawlers JS nahi chalate) -->
<meta property="og:title" content="Bidyadhar Sahoo | Digital Visiting Card">
<meta property="og:description" content="Sales Head | S Square">
<meta property="og:image" content="https://lh3.googleusercontent.com/pw/AP1GczOR5vzPmYMH-Ri-p4lh8hLmMRcwyO7fmrNpOIqTrdMFY6wQzKH1T2AfBqarQlEm6QrrbkuK-gvtE5PGpCNIp85-_kLZN9r3kdd4Fu8OzeBGXrnF1f4SuqvtZdxGUBcL6-B18sbVpZxtWGE6eWB-wIU=w600-h338-s-no-gm?authuser=0">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #edebeb;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 140vh;
}

.flip-card {
  perspective: 1000px;
  width: 90vw;
  max-width: 360px;
  margin: 6vh auto 2vh;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  transition: transform 0.8s;
  transform-style: preserve-3d;
}

.flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  backface-visibility: hidden;
  background-color: #e6f5dc;
  border-radius: 1rem;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  overflow: hidden;
}

.flip-card-back { transform: rotateY(180deg); }

.card-img-top {
  width: 100%;
  height: auto;
  aspect-ratio: 16/9;
  object-fit: cover;
}

.card-body { padding: 1.5rem; position: relative; text-align: center; }

.pro-img {
  position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
  width: 25vw; max-width: 120px;
}

.pro-img img {
  width: 100%; border-radius: 50%;
  border: 4px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

a { text-decoration: none; color: inherit; transition: all 0.3s ease;}
a:hover { transform: scale(1.3); color: #00cccc; }

h1 { font-size: 1.7rem; margin: 2rem 0 0.6rem 0; color: #222; }
h2 { font-size: 1.0rem; margin: 3rem 0 0.6rem 0; color: #222; }

.contact-info p { margin: 0.3rem 0; font-size: 0.9rem; }

.social-icons {
  margin: 0.8rem 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 0.8rem;
}
.social-icons a {
  color: #333; font-size: 1.5rem; transition: all 0.3s ease;
}
.social-icons a:hover { transform: scale(1.3); color: #4076ff; }

button {
  border: none; outline: none; padding: 0.7rem; color: white;
  background-color: #4CAF50; cursor: pointer; width: 100%;
  font-size: 1rem; transition: background 0.3s ease;
}
button:hover { background-color: #45a049; }

.card-time-section {
  background-color: #333; color: #fff; display: flex;
  justify-content: space-around; align-items: center;
  padding: 0.5rem 0; font-family: 'Orbitron', sans-serif;
}
.card-time-section div { font-size: 0.9rem; }

.back-containers { display: flex; flex-direction: column; gap: 12px; padding: 1rem; }

.back-containers .container-item {
  background: linear-gradient(135deg, #FFDEE9, #B5FFFC);
  border-radius: 12px; padding: 12px 15px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  position: relative; transition: transform 0.3s, box-shadow 0.3s;
}
.back-containers .container-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

.text-container .text-header {
  display: flex; align-items: center; gap: 8px; font-weight: 600;
}
.text-container .text-content p {
  font-size: 0.85rem; line-height: 1.3; margin: 4px 0 0;
  display: -webkit-box; -webkit-line-clamp: 2;
  white-space: pre-wrap;
  word-wrap: break-word;
  -webkit-box-orient: vertical; overflow: hidden;
}
.text-container.expanded .text-content p { -webkit-line-clamp: unset; }
.text-container .more-link {
  color: green; font-size: 0.85rem; cursor: pointer;
  position: absolute; right: 12px; bottom: 2px;
}

.link-container {
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 600; color: #222;
}
.link-container i.fa-external-link {
  font-size: 1rem; opacity: 0.7;
}

.loading-msg {
  margin-top: 4rem; font-size: 0.95rem; color: #666;
}
</style>
</head>

<body>

<div id="loading" class="loading-msg">Loading card...</div>

<div class="flip-card" id="flipCard" style="display:none;">
  <div class="flip-card-inner">

    <!-- FRONT -->
    <div class="flip-card-front">
      <img class="card-img-top" id="bgImgFront" src="" alt="Background">
      <div class="card-body">
        <div class="pro-img">
          <img id="proImgFront" src="" alt="">
        </div>
        <h1 id="nameFront"></h1>
        <p id="designationFront"></p>

        <div class="contact-info" id="contactInfo"></div>

        <div class="social-icons" id="socialIcons"></div>
      </div>
      <button id="flipButton">Details</button>
      <div class="card-time-section">
        <div id="dateFront"></div>
        <div id="timeFront"></div>
        <div id="dayFront"></div>
      </div>
    </div>

    <!-- BACK -->
    <div class="flip-card-back">
      <img class="card-img-top" id="bgImgBack" src="" alt="Background">
      <div class="card-body">
        <div class="pro-img"><img id="proImgBack" src="" alt=""></div>
        <h2 id="backHeader"></h2>
      </div>
      <button id="flipButtonBack">Front Page</button>

      <div class="card-time-section">
        <div id="dateBack"></div>
        <div id="timeBack"></div>
        <div id="dayBack"></div>
      </div>

      <div class="back-containers" id="backContainers"></div>

      <button id="flipButtonBottom" style="margin-top:10px;">Front Page</button>
    </div>

  </div>
</div>

<script>
// ⭐ Aapki published Google Sheet ki details
const PUBLISHED_SHEET_ID = '2PACX-1vS04qGPFSwko3ovO0m-i2k_RFojUs2Dlb7D1_ZM1HOZn5Gqiev1dqC2uwnrlaMfih6l3MUYQz4n3k1Y';
const PUBLISHED_GID = '2059874539';
const CSV_URL = `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_SHEET_ID}/pub?gid=${PUBLISHED_GID}&single=true&output=csv`;

// Simple CSV parser (quoted fields, commas ke andar bhi handle karta hai)
function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function buildCardFromRows(rows) {
  const data = rows.slice(1); // pehli row header hai
  const card = { containers: [], socialIcons: [] };

  data.forEach(row => {
    const field = row[0];
    const value = row[1];

    switch (field) {
      case 'Name': card.name = value; break;
      case 'Designation': card.designation = value; break;
      case 'Phone1': card.phone1 = value; break;
      case 'Phone2': card.phone2 = value; break;
      case 'Email': card.email = value; break;
      case 'ProfileImage': card.profileImage = value; break;
      case 'BackgroundImage': card.backgroundImage = value; break;
      case 'Backheader': card.backHeader = value; break;
      case 'Social':
        if (value && row[4]) card.socialIcons.push({ icon: row[4], link: value });
        break;
      case 'Container':
        card.containers.push({
          title: value,
          text: row[2] || '',
          link: row[3] || '',
          icon: row[4] || 'fa-info-circle',
          type: row[5] || 'text',
          order: parseInt(row[6]) || 0
        });
        break;
    }
  });

  card.containers.sort((a, b) => a.order - b.order);
  return card;
}

function renderCard(card) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('flipCard').style.display = 'block';

  if (card.backgroundImage) {
    document.getElementById('bgImgFront').src = card.backgroundImage;
    document.getElementById('bgImgBack').src = card.backgroundImage;
  }
  if (card.profileImage) {
    document.getElementById('proImgFront').src = card.profileImage;
    document.getElementById('proImgFront').alt = card.name || '';
    document.getElementById('proImgBack').src = card.profileImage;
    document.getElementById('proImgBack').alt = card.name || '';
  }
  if (card.name) {
    document.getElementById('nameFront').textContent = card.name;
    document.title = card.name + ' | Digital Visiting Card';
  }
  if (card.designation) document.getElementById('designationFront').textContent = card.designation;
  if (card.backHeader) document.getElementById('backHeader').textContent = card.backHeader;

  // Contact info
  const contactInfo = document.getElementById('contactInfo');
  let contactHtml = '';
  if (card.phone1) contactHtml += `<p><i class="fa fa-phone"></i> <a href="tel:${card.phone1}">${card.phone1}</a></p>`;
  if (card.phone2) contactHtml += `<p><i class="fa fa-phone"></i> <a href="tel:${card.phone2}">${card.phone2}</a></p>`;
  if (card.email) contactHtml += `<p><i class="fa fa-envelope"></i> <a href="mailto:${card.email}">${card.email}</a></p>`;
  contactInfo.innerHTML = contactHtml;

  // Social icons
  const socialIcons = document.getElementById('socialIcons');
  socialIcons.innerHTML = card.socialIcons.map(s =>
    `<a href="${s.link}" target="_blank"><i class="fa ${s.icon}"></i></a>`
  ).join('');

  // Back containers
  const backContainers = document.getElementById('backContainers');
  backContainers.innerHTML = card.containers.map(c => {
    if (c.type === 'text') {
      return `<div class="container-item text-container">
                <div class="text-header"><i class="fa ${c.icon}"></i> <strong>${c.title}</strong></div>
                <div class="text-content"><p>${c.text}</p></div>
                <span class="more-link">More</span>
              </div>`;
    } else if (c.type === 'link') {
      return `<a href="${c.link}" target="_blank" class="container-item link-container">
                <span><i class="fa ${c.icon}"></i> <strong>${c.title}</strong></span>
                <i class="fa fa-external-link"></i>
              </a>`;
    }
    return '';
  }).join('');

  // Expand text listeners (dynamically added elements ke liye)
  document.querySelectorAll('.text-container').forEach(c => {
    const more = c.querySelector('.more-link');
    more.addEventListener('click', () => {
      c.classList.toggle('expanded');
      more.textContent = c.classList.contains('expanded') ? 'Less' : 'More';
    });
  });
}

// Fetch aur render karo
fetch(CSV_URL)
  .then(res => res.text())
  .then(csvText => {
    const rows = parseCsv(csvText);
    const card = buildCardFromRows(rows);
    renderCard(card);
  })
  .catch(err => {
    document.getElementById('loading').textContent = 'Card load nahi ho paya. Baad mein try karein.';
    console.error(err);
  });

// Flip logic
const flipCard = document.getElementById('flipCard');

function scrollToCardTop() {
  flipCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('flipButton').onclick = () => {
  flipCard.classList.add('flipped');
  scrollToCardTop();
};
document.getElementById('flipButtonBack').onclick = () => {
  flipCard.classList.remove('flipped');
  scrollToCardTop();
};
document.getElementById('flipButtonBottom').onclick = () => {
  flipCard.classList.remove('flipped');
  scrollToCardTop();
};

// Time
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const date = now.getDate();
  const month = now.toLocaleString('default',{month:'short'});
  const year = now.getFullYear();
  const day = now.toLocaleString('default',{weekday:'long'});
  document.getElementById('timeFront').textContent = `${h}:${m}:${s}`;
  document.getElementById('dateFront').textContent = `${date} ${month} ${year}`;
  document.getElementById('dayFront').textContent = day;
  document.getElementById('timeBack').textContent = `${h}:${m}:${s}`;
  document.getElementById('dateBack').textContent = `${date} ${month} ${year}`;
  document.getElementById('dayBack').textContent = day;
}
setInterval(updateTime, 1000);
updateTime();
</script>
</body>
</html>
